<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="form-container">
        <img src="https://static.vecteezy.com/system/resources/previews/009/664/099/original/sun-sun-ray-icon-transparent-free-png.png" alt="Sun icon" height="100" width="100">
        <h2>Sun Son Solar</h2>
        <h1>Registration Form</h1>

        <form method="POST" action="backend.php">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" placeholder="First Name" required>
            </div>

            <div class="form-group">
                <label for="middleName">Middle Name</label>
                <input type="text" id="middleName" name="middleName" placeholder="Middle Name">
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" placeholder="Last Name" required>
            </div>

            <div class="form-group">
                <label for="birthDate">Birth Date</label>
                <input type="date" id="birthDate" name="birthDate" required>
            </div>

            <fieldset class="form-group gender">
                <legend>Gender</legend>

                <label><input type="radio" id="male" name="gender" value="Male"> Male</label>
                <label><input type="radio" id="female" name="gender" value="Female"> Female</label>
                <label><input type="radio" id="other" name="gender" value="Other"> Other</label>
            </fieldset>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="username@email.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="09XXXXXXXXX" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="4" placeholder="House No. Lot" required></textarea>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required>
            </div>

            <div class="buttons">
                <button type="submit">Register</button>
            </div>
        </form>
    </main>

</body>
</html>
